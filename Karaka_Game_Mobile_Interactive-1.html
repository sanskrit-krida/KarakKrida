<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>कारक-खेळः — Kāraka Game</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;background:#f5f7fb;color:#172033}
.app{max-width:620px;margin:auto;padding:16px}
header{padding:10px 2px 14px}.brand{font-size:26px;font-weight:800}.sub{color:#64748b;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:white;border:1px solid #e3e8f0;border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:#64748b}
.card{background:white;border:1px solid #e1e7ef;border-radius:18px;padding:18px}
.level{font-size:13px;font-weight:700;color:#5b6475;margin-bottom:10px}
.sentence{font-size:24px;line-height:1.55;text-align:center;padding:14px 8px;background:#f8fafc;border-radius:14px;margin-bottom:15px}
.target{text-align:center;font-size:16px;margin-bottom:10px}.target strong{font-size:21px}
.q{font-size:17px;font-weight:700;margin-bottom:12px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;min-height:48px;border-radius:12px;border:1px solid #d8dee8;background:white;padding:10px 12px;cursor:pointer}
.option{text-align:center;font-weight:700}.option:active{transform:scale(.98)}
.option.correct{background:#e8f7ee;border-color:#4caf70}.option.wrong{background:#fff0f0;border-color:#d95c5c}
.actions{display:flex;gap:9px;margin-top:14px}.actions button{flex:1}
.primary{background:#334155;color:white;border-color:#334155}.hint{background:#fff8e6;border-color:#f1d28b}
.feedback{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc;line-height:1.5}
.hidden{display:none}.progress{height:7px;background:#e8edf4;border-radius:10px;overflow:hidden;margin:8px 0 14px}.bar{height:100%;background:#64748b;width:0}
.start{text-align:center;padding:20px 4px}.start h2{margin:5px 0 8px}.start p{color:#64748b;line-height:1.5}
.start .mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.end{text-align:center}.big{font-size:38px;font-weight:800;margin:8px}.review{margin-top:14px;text-align:left;max-height:300px;overflow:auto}.review div{padding:9px;border-bottom:1px solid #e5e7eb;font-size:14px}
@media(max-width:380px){.app{padding:10px}.sentence{font-size:21px}.options{grid-template-columns:1fr}.brand{font-size:23px}}
</style>
</head>
<body>
<div class="app" id="app">
<header><div class="brand">॥ कारक-खेळः ॥</div><div class="sub">Sanskrit Kāraka Identification Game</div></header>
<div id="start" class="card start">
<h2>🎮 कारक ओळखा!</h2>
<p>वाक्य वाचा → लक्ष्य शब्द ओळखा → योग्य कारक निवडा.<br>तुमच्या अध्यापनातील Hint पद्धतीनुसार सराव.</p>
<div class="mode">
<button class="primary" data-mode="10">10 प्रश्नांचा खेळ</button>
<button data-mode="all">100 प्रश्नांचा सराव</button>
</div>
</div>
<div id="game" class="hidden">
<div class="stats"><div class="stat"><b id="score">0</b><span>गुण</span></div><div class="stat"><b id="num">1</b><span>प्रश्न</span></div><div class="stat"><b id="correct">0</b><span>बरोबर</span></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card">
<div class="level" id="level"></div>
<div class="sentence" id="sentence"></div>
<div class="target">लक्ष्य शब्द: <strong id="target"></strong></div>
<div class="q" id="question"></div>
<div class="options" id="options"></div>
<div class="actions"><button class="hint" id="hintBtn">💡 Hint</button><button class="primary hidden" id="nextBtn">पुढचा प्रश्न →</button></div>
<div id="hintBox" class="feedback hidden"></div>
<div id="feedback" class="feedback hidden"></div>
</div>
</div>
<div id="end" class="card end hidden">
<h2>🎉 खेळ पूर्ण!</h2><div class="big" id="finalScore"></div>
<p id="finalMsg"></p><button class="primary" id="again">पुन्हा खेळा</button>
<div class="review" id="review"></div>
</div>
</div>

const app=document.getElementById("app"), start=document.getElementById("start"), game=document.getElementById("game"), end=document.getElementById("end");
let pool=[],i=0,score=0,correct=0,answered=false,review=[];
const $=id=>document.getElementById(id);
function shuffle(a){return a.slice().sort(()=>Math.random()-0.5)}
function startGame(count){
  pool=shuffle(DATA).slice(0,Math.min(count,DATA.length)); i=0;score=0;correct=0;review=[];
  start.classList.add("hidden");end.classList.add("hidden");game.classList.remove("hidden");show();
}
function show(){
  answered=false; $("score").textContent=score;$("correct").textContent=correct;$("num").textContent=i+1;
  $("bar").style.width=((i)/pool.length*100)+"%";
  const d=pool[i];
  $("level").textContent=d.level+"  •  प्रश्न "+(i+1)+" / "+pool.length;
  $("sentence").textContent=d.sentence;
  $("target").textContent=d.target;
  $("question").textContent=d.question;
  $("feedback").classList.add("hidden");$("hintBox").classList.add("hidden");$("nextBtn").classList.add("hidden");
  $("hintBtn").disabled=false;
  const box=$("options");box.innerHTML="";
  shuffle(d.options).forEach(opt=>{
    const b=document.createElement("button");b.className="option";b.textContent=opt;b.type="button";
    b.addEventListener("click",()=>answer(opt,b));box.appendChild(b);
  });
}
function answer(opt,btn){
 if(answered)return;answered=true;
 const d=pool[i], ok=opt===d.answer;
 document.querySelectorAll(".option").forEach(b=>{b.disabled=true;if(b.textContent===d.answer)b.classList.add("correct")});
 if(!ok)btn.classList.add("wrong"); if(ok){score+=10;correct++}
 $("score").textContent=score;$("correct").textContent=correct;
 $("feedback").classList.remove("hidden");
 $("feedback").innerHTML=(ok?"<b>✅ बरोबर!</b> +10 गुण":"<b>❌ प्रयत्न चांगला!</b> योग्य उत्तर: <b>"+d.answer+"</b>")+"<br>"+d.explain;
 $("hintBtn").disabled=true;$("nextBtn").classList.remove("hidden");
 review.push({d,ok,opt});
}
$("hintBtn").addEventListener("click",()=>{const d=pool[i];$("hintBox").classList.remove("hidden");$("hintBox").textContent="💡 "+d.hint});
$("nextBtn").addEventListener("click",()=>{i++;if(i>=pool.length)finish();else show()});
function finish(){
 game.classList.add("hidden");end.classList.remove("hidden");
 $("finalScore").textContent=score+" / "+(pool.length*10);
 const pct=Math.round(correct/pool.length*100);
 $("finalMsg").textContent=pct>=80?"उत्कृष्ट! कारकबोधः मजबूत आहे.":pct>=60?"छान! अजून थोडा सराव केला तर उत्तम होईल.":"पुन्हा खेळा आणि Hint वापरून कारक ओळखण्याचा सराव करा.";
 $("review").innerHTML=review.map((x,k)=>"<div><b>"+(k+1)+". "+(x.ok?"✅":"❌")+" "+x.d.answer+"</b><br>"+x.d.sentence+"<br>लक्ष्य: "+x.d.target+"</div>").join("");
}
$("again").addEventListener("click",()=>{end.classList.add("hidden");start.classList.remove("hidden")});
start.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>startGame(b.dataset.mode==="all"?DATA.length:10)));
</script>
